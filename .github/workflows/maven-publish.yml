name: Publish Maven Package

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: central                # MUST match <publishingServerId> in your POM
          server-username: MAVEN_USERNAME   # Name of the env var for the username
          server-password: MAVEN_PASSWORD   # Name of the env var for the password
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }} # Value of the GPG private key to import
          gpg-passphrase: MAVEN_GPG_PASSPHRASE # env variable for GPG private key passphrase

      - name: Set project version
        id: set_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            # Strip any leading 'v' from the tag (e.g., v1.0.0 → 1.0.0)
            VERSION="${TAG_NAME#v}"
          else
            echo "No version provided (either via input or release tag)"
            exit 1
          fi
          echo "Setting version to $VERSION"
          mvn versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Publish to GitHub Packages and Maven Central
        run: mvn -B deploy -Pdeployment -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts
          path: |
            target/*.jar
            target/*.pom
          retention-days: 30